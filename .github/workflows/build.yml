name: build-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ShellApp
        run: xcodegen generate

      - name: Build unsigned
        working-directory: ShellApp
        run: |
          set -o pipefail
          xcodebuild \
            -project ShellApp.xcodeproj \
            -scheme ShellApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | grep -E "error:|warning: .*deprecated|BUILD|\.app$" | tail -40

      - name: Package unsigned ipa
        working-directory: ShellApp
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"
          test -n "$APP"
          ls -la "$APP"
          test -f "$APP/ShellApp" || { echo "FATAL: app binary missing"; exit 1; }
          rm -rf Payload ShellApp-unsigned.ipa
          mkdir -p Payload
          ditto "$APP" "Payload/$(basename "$APP")"
          zip -qry ShellApp-unsigned.ipa Payload
          unzip -l ShellApp-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ShellApp-unsigned-ipa
          path: ShellApp/ShellApp-unsigned.ipa
          retention-days: 7
