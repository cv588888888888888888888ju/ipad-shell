name: build-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ShellApp
        run: xcodegen generate

      - name: Build unsigned
        working-directory: ShellApp
        run: |
          xcodebuild \
            -project ShellApp.xcodeproj \
            -scheme ShellApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -30

      - name: Package unsigned ipa
        working-directory: ShellApp
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ShellApp-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ShellApp-unsigned-ipa
          path: ShellApp/ShellApp-unsigned.ipa
          retention-days: 7
